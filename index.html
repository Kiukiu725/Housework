<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>家友記 - 香港家庭雜務與開支管理</title>
  
  <!-- 手機主畫面 App Icon 設定 (上傳 icon.png 到 GitHub 即可生效) -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="家友記">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+HK:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans HK', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideDownSpring {
      0% { opacity: 0; transform: translate(-50%, -24px) scale(0.96); }
      100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
    .push-banner-enter {
      animation: slideDownSpring 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-28 selection:bg-emerald-100 selection:text-emerald-900">

  <!-- ================= 頂部浮動 Push Notification 彈窗 ================= -->
  <div id="pushBanner" class="fixed top-3 left-1/2 -translate-x-1/2 w-[94%] max-w-md z-50 hidden push-banner-enter">
    <div class="bg-slate-900/95 backdrop-blur-xl text-white p-4 rounded-3xl shadow-2xl border border-slate-700/80 ring-1 ring-white/10">
      <div class="flex items-start gap-3">
        <div id="pushBannerIconBox" class="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shrink-0 shadow-lg shadow-emerald-500/20">
          <i data-lucide="bell-ring" class="w-5 h-5 text-white"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between gap-2">
            <span id="pushBannerTag" class="text-[11px] font-bold uppercase tracking-wider text-emerald-400">家友記 • 即時動態</span>
            <span id="pushBannerTime" class="text-[10px] text-slate-400 shrink-0">剛剛</span>
          </div>
          <h4 id="pushBannerTitle" class="text-sm font-bold text-white mt-0.5 leading-snug">通知標題</h4>
          <p id="pushBannerBody" class="text-xs text-slate-300 mt-1 leading-relaxed"></p>
        </div>
        <button onclick="hidePushBanner()" class="p-1 text-slate-400 hover:text-white rounded-xl hover:bg-slate-800 transition-colors shrink-0">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ================= 頂部導航與狀態列 ================= -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
    <div class="max-w-lg mx-auto px-4 pt-3 pb-2.5">
      <div class="flex items-center justify-between gap-2">
        <!-- App 名稱 & 狀態 -->
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white shadow-md shadow-emerald-500/20 shrink-0 overflow-hidden">
            <img src="icon.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" class="w-full h-full object-cover">
            <i data-lucide="home" class="w-5 h-5 hidden"></i>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5 cursor-pointer" onclick="openAppNameModal()">
              <h1 id="headerAppName" class="text-base sm:text-lg font-extrabold text-slate-900 truncate">家友記</h1>
              <i data-lucide="pencil" class="w-3.5 h-3.5 text-slate-400 shrink-0"></i>
            </div>
            <div class="flex items-center gap-1.5 mt-0.5">
              <button onclick="switchTab('sync')" id="syncStatusBadge" class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
                <span id="syncStatusDot" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                <span id="syncStatusLabel">點此輸入房號同步</span>
              </button>
            </div>
          </div>
        </div>

        <!-- 「我係邊個」切換器 + 鈴鐺 -->
        <div class="flex items-center gap-2 shrink-0">
          <div class="flex items-center bg-slate-100 rounded-xl px-2.5 py-1.5 border border-slate-200/80">
            <span class="text-[11px] font-semibold text-slate-500 mr-1">我係:</span>
            <select id="currentUserSelect" onchange="handleCurrentUserChange(this.value)" class="bg-transparent text-xs font-extrabold text-emerald-700 focus:outline-none cursor-pointer pr-1"></select>
          </div>
          <button onclick="switchTab('notifications')" class="relative p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors">
            <i data-lucide="bell" class="w-4 h-4"></i>
            <span id="unreadNotifBadge" class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-extrabold flex items-center justify-center">0</span>
          </button>
        </div>
      </div>

      <!-- 橫向空間切換列 -->
      <div id="spaceSwitcherBar" class="flex items-center gap-2 overflow-x-auto no-scrollbar mt-3 pb-0.5"></div>
    </div>
  </header>

  <!-- ================= 主頁內容區 ================= -->
  <main class="max-w-lg mx-auto px-4 pt-4">

    <!-- TAB 1: 家務事項 -->
    <section id="viewTasks" class="space-y-4">
      <div class="grid grid-cols-3 gap-2.5">
        <div class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-xs">
          <span class="text-[11px] font-semibold text-slate-400 block">待辦家務</span>
          <div class="mt-1 flex items-baseline gap-1">
            <span id="statPendingCount" class="text-2xl font-black text-slate-900">0</span>
            <span class="text-[11px] text-slate-400">項</span>
          </div>
        </div>
        <div onclick="switchTab('notifications')" class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-xs cursor-pointer hover:border-rose-300 transition-colors">
          <span class="text-[11px] font-bold text-rose-500 flex items-center gap-1">
            <i data-lucide="flame" class="w-3 h-3"></i>今日/過期
          </span>
          <div class="mt-1 flex items-baseline gap-1">
            <span id="statUrgentCount" class="text-2xl font-black text-rose-600">0</span>
            <span class="text-[11px] text-slate-400">項</span>
          </div>
        </div>
        <button onclick="openChoreModal()" class="bg-gradient-to-br from-emerald-500 to-teal-600 hover:from-emerald-600 text-white p-3.5 rounded-2xl shadow-md shadow-emerald-500/20 flex flex-col items-center justify-center gap-1 active:scale-95 transition-all">
          <i data-lucide="plus-circle" class="w-6 h-6"></i>
          <span class="text-xs font-extrabold">新增家務</span>
        </button>
      </div>

      <!-- 篩選列 -->
      <div id="memberQuickFilterBar" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-400">家務清單</h2>
        <div class="inline-flex bg-slate-200/80 p-0.5 rounded-xl text-xs font-bold">
          <button onclick="setTaskStatusFilter('pending')" id="statusBtn_pending" class="px-3 py-1 rounded-lg bg-white text-slate-900 shadow-xs">未完成</button>
          <button onclick="setTaskStatusFilter('completed')" id="statusBtn_completed" class="px-3 py-1 rounded-lg text-slate-600">已搞掂</button>
          <button onclick="setTaskStatusFilter('all')" id="statusBtn_all" class="px-3 py-1 rounded-lg text-slate-600">全部</button>
        </div>
      </div>
      <div id="tasksListContainer" class="space-y-3"></div>
    </section>

    <!-- TAB 2: 家庭開支 -->
    <section id="viewExpenses" class="space-y-4 hidden">
      <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 text-white rounded-3xl p-5 shadow-lg">
        <div class="flex items-start justify-between">
          <div>
            <span class="text-xs font-semibold text-slate-300">總累計家庭開支</span>
            <div class="text-3xl font-black tracking-tight mt-1" id="expenseTotalDisplay">HK$ 0</div>
          </div>
          <button onclick="openExpenseModal()" class="px-3.5 py-2 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs flex items-center gap-1.5 shadow-md active:scale-95 transition-all">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>記低開支</span>
          </button>
        </div>
        <div id="expenseBarsContainer" class="mt-5 pt-4 border-t border-white/10 space-y-2.5"></div>
      </div>
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-400">開支明細</h2>
        <span id="expenseCountLabel" class="text-xs text-slate-400 font-medium">共 0 筆</span>
      </div>
      <div id="expensesListContainer" class="space-y-2.5"></div>
    </section>

    <!-- TAB 3: 提醒與動態通知 -->
    <section id="viewNotifications" class="space-y-4 hidden">
      <div class="bg-gradient-to-br from-emerald-600 to-teal-700 text-white rounded-3xl p-4 shadow-md space-y-3">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-2xl bg-white/20 flex items-center justify-center shrink-0">
            <i data-lucide="bell-ring" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="text-sm font-extrabold">即時動態通知廣播與測試</h3>
            <p class="text-[11px] text-emerald-100">每次有用戶新增家務或開支，所有人即時收到通知</p>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="simulateFamilyAddItem()" class="py-2.5 px-3 rounded-2xl bg-white text-emerald-950 font-extrabold text-xs shadow-xs active:scale-95 transition-all flex items-center justify-center gap-1.5">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
            <span>模擬家人加Item彈通知</span>
          </button>
          <button onclick="triggerMorningReminder(true)" class="py-2.5 px-3 rounded-2xl bg-emerald-900/50 text-white border border-white/20 font-extrabold text-xs active:scale-95 transition-all flex items-center justify-center gap-1.5">
            <i data-lucide="sun" class="w-3.5 h-3.5"></i>
            <span>即刻測試早晨提醒</span>
          </button>
        </div>
      </div>

      <!-- 設定面板 -->
      <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-xs space-y-3.5">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
          <div>
            <h3 class="text-sm font-extrabold text-slate-900">通知與早晨提醒設定</h3>
            <p class="text-xs text-slate-400">自訂早晨定時提醒時間及音效</p>
          </div>
          <button onclick="requestNativeNotificationPermission()" id="nativePermBtn" class="px-3 py-1.5 rounded-xl text-[11px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
            開啟瀏覽器通知
          </button>
        </div>

        <div class="flex items-center justify-between text-xs">
          <div>
            <span class="font-bold text-slate-800 block">每日早晨提醒時間</span>
            <span class="text-[11px] text-slate-400">今日 Due Day 及逾期家務排在最前提醒</span>
          </div>
          <input type="time" id="morningRemindTimeInput" onchange="updateMorningTime(this.value)" class="px-2.5 py-1.5 rounded-xl border border-slate-200 font-bold bg-slate-50 text-slate-800 text-xs">
        </div>
      </div>

      <!-- 家人即時動態紀錄 -->
      <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-xs space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-400">家人即時動態紀錄</h3>
          <button onclick="clearActivityLogs()" class="text-[11px] font-bold text-slate-400 hover:text-rose-500 transition-colors">清除紀錄</button>
        </div>
        <div id="activityLogsContainer" class="space-y-2"></div>
      </div>
    </section>

    <!-- TAB 4: 管理中心 -->
    <section id="viewManagement" class="space-y-4 hidden">
      <div class="bg-white rounded-3xl p-2 border border-slate-200 shadow-xs flex items-center gap-1 overflow-x-auto no-scrollbar">
        <button onclick="switchAdminSubTab('members')" id="adminSubBtn_members" class="px-3 py-2 rounded-2xl text-xs font-bold transition-all bg-emerald-500 text-white shadow-xs">家庭成員</button>
        <button onclick="switchAdminSubTab('choreCats')" id="adminSubBtn_choreCats" class="px-3 py-2 rounded-2xl text-xs font-bold transition-all text-slate-600">家務類別</button>
        <button onclick="switchAdminSubTab('expenseCats')" id="adminSubBtn_expenseCats" class="px-3 py-2 rounded-2xl text-xs font-bold transition-all text-slate-600">開支類別</button>
        <button onclick="switchAdminSubTab('households')" id="adminSubBtn_households" class="px-3 py-2 rounded-2xl text-xs font-bold transition-all text-slate-600">空間物業</button>
      </div>
      <div id="adminPanelContainer" class="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-xs"></div>
    </section>

    <!-- TAB 5: 雲端房間同步 (只須輸入房號) -->
    <section id="viewSync" class="space-y-4 hidden">
      <div class="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-xs space-y-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-emerald-50 border border-emerald-100 flex items-center justify-center text-emerald-600 shrink-0">
            <i data-lucide="cloud" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="text-sm font-extrabold text-slate-900">房間同步（只需輸入房號）</h3>
            <p class="text-xs text-slate-400">同屋企人輸入同一個房號，即可 24 小時自動雙向同步</p>
          </div>
        </div>

        <!-- 雲端連線狀態卡片 -->
        <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-700">目前房間狀態</span>
            <span id="myPeerIdDisplay" class="text-xs font-mono font-extrabold text-emerald-600 tracking-wider">未入房 (單機模式)</span>
          </div>
        </div>

        <!-- 輸入房號開房 / 入房 -->
        <div class="space-y-2">
          <label class="text-xs font-bold text-slate-700 block">輸入房間號碼（開新房 / 加入房間）</label>
          <div class="flex gap-2">
            <input type="text" id="targetPeerIdInput" placeholder="例如: HOME88 或 123456" class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-mono font-bold uppercase focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
            <button onclick="connectToPeer()" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs shadow-xs shrink-0 active:scale-95 transition-all">
              連入房間
            </button>
          </div>
        </div>

        <!-- 房間快捷操作掣 -->
        <div class="grid grid-cols-2 gap-2">
          <button onclick="shareRoomLink()" class="py-2.5 px-3 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-extrabold text-xs flex items-center justify-center gap-1.5 transition-colors">
            <i data-lucide="link" class="w-3.5 h-3.5"></i>
            <span>複製邀請 Link (免打房號)</span>
          </button>
          <button onclick="leaveCloudRoom()" class="py-2.5 px-3 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-extrabold text-xs flex items-center justify-center gap-1.5 transition-colors">
            <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
            <span>離開房間</span>
          </button>
        </div>

        <!-- 離線同步碼分享 (WhatsApp 後備方案) -->
        <div class="pt-3 border-t border-slate-100 flex gap-2">
          <button onclick="copySyncCodeWhatsApp()" class="flex-1 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold text-xs flex items-center justify-center gap-1.5">
            <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
            <span>複製離線備份碼</span>
          </button>
          <button onclick="importSyncCodePrompt()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold text-xs">
            貼上匯入
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- ================= 底部導航欄 ================= -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 px-3 py-2 z-20 shadow-md">
    <div class="max-w-md mx-auto grid grid-cols-5 gap-1">
      <button onclick="switchTab('tasks')" id="tabBtn_tasks" class="flex flex-col items-center gap-1 py-1 text-emerald-600 font-bold transition-all">
        <i data-lucide="check-square" class="w-5 h-5"></i>
        <span class="text-[10px]">家務</span>
      </button>
      <button onclick="switchTab('expenses')" id="tabBtn_expenses" class="flex flex-col items-center gap-1 py-1 text-slate-400 hover:text-slate-600 transition-all">
        <i data-lucide="circle-dollar-sign" class="w-5 h-5"></i>
        <span class="text-[10px]">開支</span>
      </button>
      <button onclick="switchTab('notifications')" id="tabBtn_notifications" class="flex flex-col items-center gap-1 py-1 text-slate-400 hover:text-slate-600 transition-all relative">
        <i data-lucide="bell" class="w-5 h-5"></i>
        <span class="text-[10px]">提醒通知</span>
        <span id="navNotifDot" class="hidden absolute top-1 right-5 w-2 h-2 rounded-full bg-rose-500"></span>
      </button>
      <button onclick="switchTab('management')" id="tabBtn_management" class="flex flex-col items-center gap-1 py-1 text-slate-400 hover:text-slate-600 transition-all">
        <i data-lucide="sliders-horizontal" class="w-5 h-5"></i>
        <span class="text-[10px]">管理中心</span>
      </button>
      <button onclick="switchTab('sync')" id="tabBtn_sync" class="flex flex-col items-center gap-1 py-1 text-slate-400 hover:text-slate-600 transition-all">
        <i data-lucide="cloud" class="w-5 h-5"></i>
        <span class="text-[10px]">房間同步</span>
      </button>
    </div>
  </nav>

  <!-- ================= MODAL: 新增家務 ================= -->
  <div id="choreModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="text-base font-extrabold text-slate-900">新增家務事項</h3>
        <button onclick="closeChoreModal()" class="text-slate-400 hover:text-slate-600 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form onsubmit="handleSaveChore(event)" class="space-y-3.5 mt-4">
        <div>
          <label class="text-xs font-bold text-slate-700 block mb-1">家務名稱 *</label>
          <input type="text" id="choreTitleInput" required placeholder="例如：洗冷氣機、買洗頭水、抹窗" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold text-slate-700 block mb-1">空間物業</label>
            <select id="choreHouseholdSelect" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs bg-white"></select>
          </div>
          <div>
            <label class="text-xs font-bold text-slate-700 block mb-1">負責人</label>
            <select id="choreAssigneeSelect" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs bg-white"></select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold text-slate-700 block mb-1">任務類別</label>
            <select id="choreCategorySelect" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs bg-white"></select>
          </div>
          <div>
            <label class="text-xs font-bold text-slate-700 block mb-1">預定日期</label>
            <input type="date" id="chorePlannedDateInput" required class="w-full px-2.5 py-1.5 rounded-xl border border-slate-200 text-xs bg-white">
          </div>
        </div>
        <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-2">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="choreHasDueCheckbox" onchange="toggleDueInputs(this.checked)" class="w-4 h-4 accent-emerald-600 rounded">
            <span class="text-xs font-bold text-slate-700">設定截止期限 (Due Date/Time)</span>
          </label>
          <div id="dueInputsRow" class="grid grid-cols-2 gap-2 hidden pt-1">
            <input type="date" id="choreDueDateInput" class="px-2 py-1.5 rounded-lg border border-slate-200 text-xs bg-white">

    function openCustomPrompt(title, defaultValue, callback) {
      document.getElementById('customDialogTitle').innerText = title;

    function openCustomConfirm(title, message, onConfirm) {
      document.getElementById('customDialogTitle').innerText = title;

      confirmBtn.onclick = () => {
        closeCustomDialog();
        if (onConfirm) onConfirm();
      };
      document.getElementById('customDialogModal').classList.remove('hidden');
    }

      document.getElementById('customDialogModal').classList.add('hidden');

      try {

        if (raw) return { ...defaultState, ...JSON.parse(raw) };
      } catch (e) { console.error(e); }
      return defaultState;
    })();

    function saveState(isFromCloud = false) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));

        if (!isFromCloud && typeof window.pushStateToFirebase === 'function') {
          window.pushStateToFirebase();
        }
      } catch (e) { console.error(e); }
    }

    function playChimeSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch (e) {}
    }

    let bannerTimer = null;
    function showPushBanner(title, body, tag = '即時通知') {
      const banner = document.getElementById('pushBanner');
      document.getElementById('pushBannerTitle').innerText = title;
      document.getElementById('pushBannerBody').innerText = body;
      document.getElementById('pushBannerTag').innerText = tag;
      document.getElementById('pushBannerTime').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      banner.classList.remove('hidden');
      playChimeSound();

      if ('Notification' in window && Notification.permission === 'granted') {
        try { new Notification(title, { body: body }); } catch (e) {}
      }

      if (bannerTimer) clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => { hidePushBanner(); }, 6000);
    }

    function hidePushBanner() {
      document.getElementById('pushBanner').classList.add('hidden');
    }

    function addActivityLog(text, type = 'action') {
      const log = {
        id: 'l_' + Date.now() + Math.random().toString(36).substr(2, 4),
        text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        type
      };
      appState.activityLogs.unshift(log);
      if (appState.activityLogs.length > 50) appState.activityLogs.pop();
    }

    function broadcastAction(actionType, detail, notificationMsg) {
      addActivityLog(notificationMsg.fullText, actionType);
      showPushBanner(notificationMsg.title, notificationMsg.body, '家人動態廣播');
      
      appState.lastBroadcast = {
        id: 'b_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        actor: appState.currentUser,
        title: notificationMsg.title,
        body: notificationMsg.body,
        timestamp: Date.now()
      };

      if (syncChannel) {
        try {
          syncChannel.postMessage({
            type: 'BROADCAST_ACTIVITY',
            roomCode: currentRoomCode,
            actor: appState.currentUser,
            notification: notificationMsg,
            fullState: appState
          });
        } catch (e) {}
      }
      saveState();
    }

    function simulateFamilyAddItem() {
      const familyNames = appState.members.filter(m => !m.deleted && m.name !== appState.currentUser).map(m => m.name);
      const actor = familyNames.length ? familyNames[Math.floor(Math.random() * familyNames.length)] : '媽咪';

      if (isExpense) {

    function triggerMorningReminder(force = false) {
      const activeChores = appState.tasks.filter(t => !t.deleted && !t.completed);

      let title = `🌅 ${appState.appName} 早晨提醒`;
      let body = '';
      if (urgent.length > 0) {
        body = `今日有 ${urgent.length} 項家務到期 (Due)！首要任務：${urgent[0].title}`;
      } else if (activeChores.length > 0) {
        body = `今日有 ${activeChores.length} 項家務待辦，預定事項：${activeChores[0].title}`;
      } else {
        body = `今日全屋乾乾淨淨，暫無待辦事項！好好放鬆一天。`;
      }
      showPushBanner(title, body, '早晨排程提醒');
    }

    function mergeCRDTLists(localList, remoteList) {
      const map = new Map();
      (localList || []).forEach(item => map.set(item.id, item));
      (remoteList || []).forEach(remoteItem => {
        const localItem = map.get(remoteItem.id);
        if (!localItem) {
          map.set(remoteItem.id, remoteItem);
        } else {
          if ((remoteItem.updatedAt || 0) > (localItem.updatedAt || 0)) {
            map.set(remoteItem.id, remoteItem);
          }
        }
      });
      return Array.from(map.values());
    }

    function renderTasks() {
      const activeHouseholds = appState.households.filter(h => !h.deleted);
      const activeMembers = appState.members.filter(m => !m.deleted);
      
      const memberFilterContainer = document.getElementById('memberQuickFilterBar');

        <button onclick="setMemberFilter('ALL')" class="shrink-0 px-2.5 py-1 rounded-lg text-xs font-bold ${
          appState.selectedMemberFilter === 'ALL' ? 'bg-emerald-100 text-emerald-800' : 'bg-white text-slate-600 border border-slate-200'

      activeMembers.forEach(m => {
        memberHtml += `

          }">${m.name}</button>
        `;
      });
      memberFilterContainer.innerHTML = memberHtml;

      const filtered = appState.tasks.filter(t => {
        if (t.deleted) return false;
        if (appState.currentSpaceId !== 'ALL' && t.householdId !== appState.currentSpaceId) return false;
        if (appState.selectedMemberFilter !== 'ALL' && t.assignee !== appState.selectedMemberFilter) return false;
        if (appState.taskFilter === 'pending') return !t.completed;
        if (appState.taskFilter === 'completed') return t.completed;
        return true;
      });

      const uncompletedAll = appState.tasks.filter(t => !t.deleted && !t.completed);
      document.getElementById('statPendingCount').innerText = uncompletedAll.length;
      const urgentCount = uncompletedAll.filter(t => t.hasDueDate && t.dueDate <= todayStr).length;

      const container = document.getElementById('tasksListContainer');

                ${isDue ? '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-rose-100 text-rose-700">⚠️ 今日到期 / 逾期</span>' : ''}
              </div>
              <h4 class="text-sm font-bold text-slate-900 ${t.completed ? 'line-through text-slate-400' : ''}">${t.title}</h4>
              ${t.notes ? `<p class="text-xs text-slate-400 mt-0.5">${t.notes}</p>` : ''}
              <div class="mt-2 text-[11px] text-slate-500 flex items-center justify-between">
                <span>預定: ${t.plannedDate}</span>
                <span class="font-bold text-slate-700">負責人: ${t.assignee}</span>

            <button onclick="softDeleteTask('${t.id}')" class="text-slate-300 hover:text-rose-500 p-1 shrink-0"><i data-lucide="trash-2" class="w-4 h-4"></i></button>

      }).join('');

    function renderExpenses() {
      const activeHouseholds = appState.households.filter(h => !h.deleted);

      const barsContainer = document.getElementById('expenseBarsContainer');
      barsContainer.innerHTML = activeHouseholds.map(h => {

          <div class="text-xs">
            <div class="flex justify-between mb-1">

    let currentRoomCode = localStorage.getItem('HOMESYNC_ROOM_CODE') || '';

    function initSafeSyncChannel() {
      try {
        if ('BroadcastChannel' in window) {
          if (syncChannel) syncChannel.close();
          syncChannel = new BroadcastChannel('homesync_hk_p2p_bus');
          syncChannel.onmessage = (event) => {
            const data = event.data;
            if (!data || data.roomCode !== currentRoomCode) return;

            if (data.type === 'SYNC_HANDSHAKE') {
              appState.tasks = mergeCRDTLists(appState.tasks, data.state.tasks || []);
              appState.expenses = mergeCRDTLists(appState.expenses, data.state.expenses || []);
              appState.households = mergeCRDTLists(appState.households, data.state.households || []);
              appState.members = mergeCRDTLists(appState.members, data.state.members || []);
              saveState(true);
            } else if (data.type === 'BROADCAST_ACTIVITY') {
              appState.tasks = mergeCRDTLists(appState.tasks, data.fullState.tasks || []);
              appState.expenses = mergeCRDTLists(appState.expenses, data.fullState.expenses || []);
              addActivityLog(data.notification.fullText, 'remote_broadcast');
              showPushBanner(data.notification.title, data.notification.body, '家人即時廣播');
              saveState(true);
            }
          };
        }
      } catch (e) {}
    }

        try {

          const remote = JSON.parse(jsonStr);
          appState.tasks = mergeCRDTLists(appState.tasks, remote.tasks || []);
          appState.expenses = mergeCRDTLists(appState.expenses, remote.expenses || []);
          appState.households = mergeCRDTLists(appState.households, remote.households || []);
          appState.members = mergeCRDTLists(appState.members, remote.members || []);
          saveState();
          showPushBanner('🔄 同步碼匯入成功！', '已將家人的家務與開支無損合併至本機', '智能合併');
        } catch (e) {
          showPushBanner('❌ 同步碼格式無效', '請確認複製了完整的 WhatsApp 同步碼字串', '匯入錯誤');
        }
      });
    }

    function requestNativeNotificationPermission() {

          if (p === 'granted') {
            showPushBanner('✅ 系統通知已啟用', '你將會收到即時瀏覽器推播通知', '權限設定');

          }
        }).catch(() => {
          showPushBanner('🔔 已啟用 App 內置頂部橫幅通知', '系統將使用頂部動態橫幅與提示音為你推播', '通知設定');
        });
      }
    }

    window.onload = function () {

      if (timeInput && appState.notificationSettings) {
        timeInput.value = appState.notificationSettings.morningTime || '08:30';

      renderAll();
      initSafeSyncChannel();
    };
  </script>

  <!-- ================= 🔥 內置你專屬網址嘅 FIREBASE 房間同步引擎 ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // ✅ 已經直接寫死咗你條專屬 Firebase 網址，所有人都唔使再貼網址！
    const FIREBASE_DATABASE_URL = "https://kiu-s-project-default-rtdb.asia-southeast1.firebasedatabase.app";

    const app = initializeApp({ databaseURL: FIREBASE_DATABASE_URL });
    const db = getDatabase(app);

    let roomUnsubscribe = null;
    let lastHandledBroadcastId = null;

    // 加入或建立雲端房間 (只需房號)
    window.joinCloudRoom = async function(code) {
      const cleanCode = (code || '').trim().toUpperCase();
      if (!cleanCode) return;

      currentRoomCode = cleanCode;
      localStorage.setItem('HOMESYNC_ROOM_CODE', currentRoomCode);
      initSafeSyncChannel();

      if (roomUnsubscribe) roomUnsubscribe();

      // 對應你喺 Firebase Rules 設定嘅 rooms/$roomId 路徑
      const roomRef = ref(db, `rooms/homesync_${currentRoomCode}`);

      try {
        const snap = await get(roomRef);
        if (snap.exists()) {
          const remote = snap.val();
          appState.tasks = mergeCRDTLists(appState.tasks, remote.tasks || []);
          appState.expenses = mergeCRDTLists(appState.expenses, remote.expenses || []);
          appState.households = mergeCRDTLists(appState.households, remote.households || []);
          appState.members = mergeCRDTLists(appState.members, remote.members || []);
          appState.choreCategories = mergeCRDTLists(appState.choreCategories, remote.choreCategories || []);
          appState.expenseCategories = mergeCRDTLists(appState.expenseCategories, remote.expenseCategories || []);
          if (remote.appName) appState.appName = remote.appName;
        }
        await window.pushStateToFirebase();
      } catch (e) {
        console.error('Room initial fetch error:', e);
      }

      roomUnsubscribe = onValue(roomRef, (snapshot) => {
        const remote = snapshot.val();
        if (!remote) return;

        appState.tasks = mergeCRDTLists(appState.tasks, remote.tasks || []);
        appState.expenses = mergeCRDTLists(appState.expenses, remote.expenses || []);
        appState.households = mergeCRDTLists(appState.households, remote.households || []);
        appState.members = mergeCRDTLists(appState.members, remote.members || []);
        appState.choreCategories = mergeCRDTLists(appState.choreCategories, remote.choreCategories || []);
        appState.expenseCategories = mergeCRDTLists(appState.expenseCategories, remote.expenseCategories || []);
        if (remote.appName) appState.appName = remote.appName;

        if (remote.lastBroadcast && remote.lastBroadcast.id !== lastHandledBroadcastId) {
          lastHandledBroadcastId = remote.lastBroadcast.id;
          if (remote.lastBroadcast.actor !== appState.currentUser && (Date.now() - remote.lastBroadcast.timestamp < 30000)) {
            showPushBanner(remote.lastBroadcast.title, remote.lastBroadcast.body, `房間 #${currentRoomCode} 同步`);
          }
        }

        saveState(true);
      });

      updateRoomUI();
      showPushBanner('☁️ 房間已連通！', `已進入房間 #${currentRoomCode}，屋企人輸入同一個房號即可同步`, '雲端同步');
    };

    window.pushStateToFirebase = async function() {
      if (!currentRoomCode) return;
      try {
        const roomRef = ref(db, `rooms/homesync_${currentRoomCode}`);
        await set(roomRef, {
          appName: appState.appName,
          tasks: appState.tasks,
          expenses: appState.expenses,
          households: appState.households,
          members: appState.members,
          choreCategories: appState.choreCategories,
          expenseCategories: appState.expenseCategories,
          lastBroadcast: appState.lastBroadcast || null,
          updatedAt: Date.now()
        });
      } catch (e) {
        console.error('Push to Firebase error:', e);
      }
    };

    window.connectToPeer = function() {
      const inputVal = document.getElementById('targetPeerIdInput').value.trim();
      if (!inputVal) {
        showPushBanner('⚠️ 請輸入房號', '請輸入自訂房號（例如 HOME88）', '提示');
        return;
      }
      window.joinCloudRoom(inputVal);
    };

    window.leaveCloudRoom = function() {
      if (roomUnsubscribe) roomUnsubscribe();
      roomUnsubscribe = null;
      currentRoomCode = '';
      localStorage.removeItem('HOMESYNC_ROOM_CODE');
      updateRoomUI();
      showPushBanner('👋 已離開房間', '目前已切換回本機單人模式', '房間狀態');
    };

    window.shareRoomLink = function() {
      if (!currentRoomCode) {
        showPushBanner('⚠️ 尚未入房', '請先輸入房號連入房間，再複製邀請連結', '提示');
        return;
      }
      const url = `${window.location.origin}${window.location.pathname}?room=${currentRoomCode}`;
      navigator.clipboard.writeText(url);
      showPushBanner('🔗 邀請連結已複製！', `Send 俾屋企人一撳即自動入 #${currentRoomCode} 房`, '邀請家人');
    };

    function updateRoomUI() {
      const displayEl = document.getElementById('myPeerIdDisplay');
      const inputEl = document.getElementById('targetPeerIdInput');
      const labelEl = document.getElementById('syncStatusLabel');
      const dotEl = document.getElementById('syncStatusDot');

      if (currentRoomCode) {
        if (displayEl) displayEl.innerText = `房號 #${currentRoomCode} (即時同步中)`;
        if (inputEl) inputEl.value = currentRoomCode;
        if (labelEl) labelEl.innerText = `☁️ 房號 #${currentRoomCode}`;
        if (dotEl) dotEl.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping';
      } else {
        if (displayEl) displayEl.innerText = '未入房 (單機模式)';
        if (inputEl) inputEl.value = '';
        if (labelEl) labelEl.innerText = '點此輸入房號同步';
        if (dotEl) dotEl.className = 'w-1.5 h-1.5 rounded-full bg-slate-400';
      }
    }

    // 啟動時：如果網址有 ?room=XXXX 或者之前入過房，自動入返同一間房！
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const roomFromUrl = params.get('room');
      if (roomFromUrl) {
        window.joinCloudRoom(roomFromUrl);
      } else if (currentRoomCode) {
        window.joinCloudRoom(currentRoomCode);
      } else {
        updateRoomUI();
      }
    });
  </script>
</body>
</html>
